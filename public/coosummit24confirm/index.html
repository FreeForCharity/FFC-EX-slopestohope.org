<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pickup Request Received – Slopes to Hope</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://slopestohope.org/coosummit24confirm/">
  <meta http-equiv="refresh" content="5;url=https://slopestohope.org/">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:#34495e;font-family:Arial,Helvetica,sans-serif}
    main{width:100%;min-height:100vh;padding:6px 20px 80px}
    .confirmation{width:100%;max-width:900px;margin:0 auto}
    .photo{display:block;width:100%;max-width:640px;height:360px;object-fit:cover;object-position:center;margin:0 auto}
    .message{max-width:640px;margin:92px auto 0}
    h1{margin:0 0 36px;color:#006400;font-size:32px;line-height:1.2;font-weight:700}
    p{margin:0 0 48px;font-size:16px;line-height:1.5}
    .redirect{font-size:14px}
    a{color:#0000ee;text-decoration:underline}
    @media (max-width:700px){
      main{padding:0 16px 48px}
      .message{margin-top:48px}
      h1{font-size:28px;margin-bottom:28px}
      p{margin-bottom:36px}
    }
  </style>
  <script>
    window.setTimeout(function(){
      window.location.href = 'https://slopestohope.org/';
    },5000);
  </script>
</head>
<body>
  <main>
    <section class="confirmation" aria-labelledby="confirmation-title">
      <img class="photo" src="/assets/coosummit26-marriott-2026.webp" alt="Slopes to Hope collection at Marriott Vacation Club Mountain Valley Lodge">
      <div class="message">
        <h1 id="confirmation-title">Pickup Request Received</h1>
        <p>Thank you, we'll be in touch soon!</p>
        <p class="redirect">You will be redirected to our <a href="https://slopestohope.org/">homepage</a> shortly...</p>
      </div>
    </section>
  </main>
</body>
</html>
