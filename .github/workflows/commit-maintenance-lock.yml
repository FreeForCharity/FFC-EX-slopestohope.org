name: Commit maintenance lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/commit-maintenance-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'maintenance-refresh-2026-09-20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit exact generated lockfile
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff --check
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already exact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate pnpm lockfile"
          git push origin "HEAD:${HEAD_REF}"
