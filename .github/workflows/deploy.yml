name: Deploy to GitHub Pages

on:
  # Run on push to main
  push:
    branches: ['main']

  # Allows manual deployment from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v6
        # `static_site_generator: next` is deliberately NOT set: it only reads
        # next.config.js/.mjs, and would write its own next.config.js that Next
        # then prefers over this repo's next.config.ts, silently discarding it.
        # See FFC-Cloudflare-Automation#880.

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Determine base path
        id: basepath
        # A custom-domain deploy serves from the origin root, so the base path
        # must be empty; a bare github.io deploy serves from /<repo>. public/CNAME
        # is the signal for which one this is.
        run: |
          if [ -s "public/CNAME" ]; then
            echo "Using empty basePath (public/CNAME present: $(cat public/CNAME))"
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            echo "Using /$REPO_NAME basePath (no CNAME - github.io subpath deploy)"
            echo "value=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          # `out/` is the static export: Next copies public/ (the clone) into it.
          path: ./out
          # Dot-entries matter here - public/.nojekyll must reach the artifact,
          # or Pages runs the clone through Jekyll and drops _-prefixed paths.
          # See FFC-Cloudflare-Automation#788.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Post-deploy smoke check
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import os, sys, time, socket, urllib.request, urllib.error
          url = os.environ.get("DEPLOY_URL")
          if not url:
              print("DEPLOY_URL not set", file=sys.stderr)
              sys.exit(2)
          total_wait_seconds = 180
          delay_seconds = 5
          timeout_seconds = 10
          deadline = time.monotonic() + total_wait_seconds
          attempt = 0
          last = None
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  print(f"Smoke check failed: {url} (last: {last})", file=sys.stderr)
                  sys.exit(1)
              attempt += 1
              try:
                  req = urllib.request.Request(url, method="GET", headers={"User-Agent": "gh-actions-smoke"})
                  req_timeout = min(timeout_seconds, remaining)
                  with urllib.request.urlopen(req, timeout=req_timeout) as resp:
                      code = resp.getcode()
                  print(f"Attempt {attempt}: HTTP {code}")
                  print("Smoke check passed")
                  sys.exit(0)
              except urllib.error.HTTPError as e:
                  last = f"HTTPError {e.code}"
                  print(f"Attempt {attempt}: HTTPError {e.code}")
                  try:
                      e.close()
                  except Exception:
                      pass
              except (urllib.error.URLError, TimeoutError, socket.timeout) as e:
                  last = str(e)
                  print(f"Attempt {attempt} error: {e}")
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  print(f"Smoke check failed: {url} (last: {last})", file=sys.stderr)
                  sys.exit(1)
              time.sleep(min(delay_seconds, remaining))
          PY
