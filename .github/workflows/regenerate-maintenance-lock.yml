name: Regenerate maintenance lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/regenerate-maintenance-lock.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.head_ref == 'maintenance-refresh-2026-09-20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-pnpm-lock
          path: pnpm-lock.yaml
