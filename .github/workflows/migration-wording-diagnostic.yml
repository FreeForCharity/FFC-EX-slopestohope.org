name: Migration Wording Diagnostic

on:
  push:
    branches:
      - codex/org-visual-edits-2026-09-17

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare captured and current homepage wording
        run: |
          node --input-type=module <<'NODE'
          import {JSDOM,VirtualConsole} from 'jsdom';
          import {readFile} from 'node:fs/promises';
          const normalize=s=>s.replace(/\s+/g,' ').trim();
          const inventory=JSON.parse(await readFile('migration/inventory.json','utf8'));
          const expected=inventory.routes.find(r=>r.path==='/').bodyText;
          const html=await readFile('public/index.html','utf8');
          const d=new JSDOM(html,{url:'https://slopestohope.org/',virtualConsole:new VirtualConsole()}).window.document;
          const text=d.cloneNode(true);
          text.querySelectorAll('script,style,.sth-footer-links,.sth-hero__credit,.sth-newsletter-policy,footer [data-open-cookie-settings]').forEach(e=>e.remove());
          const raw=normalize(text.body.textContent);
          const actual=raw.replaceAll('$8,068 raised $25,000 goal','$8,068.03');
          const ea=expected.split(' '), aa=actual.split(' ');
          let i=0; while(i<ea.length&&i<aa.length&&ea[i]===aa[i])i++;
          let e=ea.length-1,a=aa.length-1; while(e>=i&&a>=i&&ea[e]===aa[a]){e--;a--;}
          console.log('expected length',expected.length,'actual length',actual.length);
          console.log('first differing token',i);
          console.log('EXPECTED:',ea.slice(Math.max(0,i-25),Math.min(ea.length,e+26)).join(' '));
          console.log('ACTUAL:',aa.slice(Math.max(0,i-25),Math.min(aa.length,a+26)).join(' '));
          process.exit(actual===expected?0:1);
          NODE
