name: Functional Fixes QA

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate and build
        run: pnpm run build
      - name: Browser audit
        run: pnpm run test:browser
      - name: Interaction audit
        run: pnpm run test:interactions
      - name: Consent audit
        run: pnpm run test:consent
      - name: Functional sanity checks
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {JSDOM} from 'jsdom';
          const pages=['','contact-us','our-story','faq','donors','team','gallery','partners'];
          for (const page of pages) {
            const path=page ? `public/${page}/index.html` : 'public/index.html';
            const html=await readFile(path,'utf8');
            if (html.includes('maximum-scale=1.0') || html.includes('user-scalable=no')) throw new Error(`${path}: restrictive viewport remains`);
            const d=new JSDOM(html).window.document;
            const button=d.querySelector('#menu-toggle');
            const mobile=d.querySelector('.buddyx-mobile-menu ul.menu');
            const desktop=d.querySelector('.buddyx-desktop-menu ul.menu');
            if (button?.getAttribute('aria-controls')!=='primary-menu-mobile') throw new Error(`${path}: menu button aria-controls incorrect`);
            if (mobile?.id!=='primary-menu-mobile') throw new Error(`${path}: mobile menu ID incorrect: ${mobile?.id}`);
            if (desktop?.id!=='primary-menu') throw new Error(`${path}: desktop menu ID incorrect: ${desktop?.id}`);
            if (d.querySelectorAll('#primary-menu').length!==1 || d.querySelectorAll('#primary-menu-mobile').length!==1) throw new Error(`${path}: menu IDs not unique`);
          }
          const home=await readFile('public/index.html','utf8');
          if (home.includes('establishements') || !home.includes('establishments')) throw new Error('Homepage typo correction missing');
          const staff=await readFile('out/staff/index.html','utf8');
          if (!/url=\/team\//i.test(staff) || !/href="\/team\/"/i.test(staff)) throw new Error('/staff/ compatibility redirect changed');
          console.log('Functional sanity checks passed');
          NODE
